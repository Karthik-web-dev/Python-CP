<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone Demo Locator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --border: rgba(255, 255, 255, 0.2);
            --text: white;
            --bg-light: linear-gradient(120deg, #ffffff, #e5daff);
            --text-light: #2b0052;
            --border-light: rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #4c0080, #8a2be2, #9b30ff, #5e17eb);
            background-size: 400% 400%;
            animation: bgMove 8s infinite;
            color: var(--text);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        body.light-mode {
            background: var(--bg-light);
            color: var(--text-light);
            --border: var(--border-light);
        }

        @keyframes bgMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .navbar {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .navbar h1 {
            text-shadow: 0 0 20px white;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px white;
            }

            to {
                text-shadow: 0 0 25px white;
            }
        }

        .toggle-container {
            display: flex;
            align-items: center;
        }

        .toggle-label {
            margin-right: 10px;
            font-weight: 500;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #8a2be2;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active::before {
            transform: translateX(26px);
        }

        .container {
            display: flex;
            height: calc(100vh - 80px);
        }

        .left-panel {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-group {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .input-group input:focus {
            outline: none;
            box-shadow: 0 0 15px white;
        }

        .input-group button {
            width: 100%;
            padding: 0.75rem;
            background: white;
            color: #8a2be2;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 0.5rem;
        }

        .input-group button:hover {
            box-shadow: 0 0 20px white;
            transform: scale(1.04);
        }

        .input-group button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .map-container {
            flex: 2;
            position: relative;
        }

        #map {
            height: 100%;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
        }

        .right-panel {
            flex: 1;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border-left: 1px solid var(--border);
            overflow-y: auto;
        }

        .panel-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 255, 255, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }

        .panel-card h3 {
            margin-bottom: 0.5rem;
            text-shadow: 0 0 15px white;
        }

        .panel-card p {
            margin-bottom: 0.25rem;
        }

        .history {
            max-height: 300px;
            overflow-y: auto;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .right-panel {
                border-left: none;
                border-top: 1px solid var(--border);
            }
        }
    </style>
</head>

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "© OpenStreetMap contributors",
        }).addTo(map);

        let marker;
        let trackingInterval;
        let currentPhone = "";

        const themeToggle = document.getElementById("theme-toggle");
        themeToggle.addEventListener("click", () => {
            document.body.classList.toggle("light-mode");
            themeToggle.classList.toggle("active");
        });

        document
            .getElementById("track-btn")
            .addEventListener("click", startTracking);

        document
            .getElementById("stop-btn")
            .addEventListener("click", stopTracking);

        function startTracking() {
            const phoneInput = document.getElementById("phone-input").value;
            if (!/^\d{10}$/.test(phoneInput)) {
                alert("Please enter a valid 10-digit mobile number.");
                return;
            }
            currentPhone = phoneInput;
            document.getElementById("phone-display").textContent = phoneInput;
            document.getElementById("track-btn").disabled = true;
            document.getElementById("stop-btn").disabled = false;
            updateLocation();
            trackingInterval = setInterval(updateLocation, 3000);
        }

        function stopTracking() {
            clearInterval(trackingInterval);
            document.getElementById("track-btn").disabled = false;
            document.getElementById("stop-btn").disabled = true;
        }

        function updateLocation() {
            const randomCity = cities[Math.floor(Math.random() * cities.length)];
            const {city, lat, long} = randomCity;
            const timestamp = new Date().toLocaleString();

            if (marker) {
                map.removeLayer(marker);
            }
            marker = L.marker([lat, long]).addTo(map);
            map.panTo([lat, long], {animate: true, duration: 1});

            document.getElementById("location-display").textContent =
                `${city}, India`;
            document.getElementById("city-display").textContent = city;
            document.getElementById("lat-display").textContent = lat.toFixed(4);
            document.getElementById("long-display").textContent = long.toFixed(4);
            document.getElementById("timestamp-display").textContent = timestamp;

            const historyList = document.getElementById("history-list");
            const historyItem = document.createElement("div");
            historyItem.className = "history-item";
            historyItem.textContent = `${timestamp} - ${city} (${lat.toFixed(4)}, ${long.toFixed(4)})`;
            historyList.appendChild(historyItem);
            historyList.scrollTop = historyList.scrollHeight;
        }
